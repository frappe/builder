name: Generate Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "Frappe PR Bot"
          GIT_AUTHOR_EMAIL: "developers@frappe.io"
          GIT_COMMITTER_NAME: "Frappe PR Bot"
          GIT_COMMITTER_EMAIL: "developers@frappe.io"
        # npx carries the plugins, so the release never installs the frontend workspace
        run: npx -y -p semantic-release -p @semantic-release/git -p @semantic-release/exec -- semantic-release

      # A push made with GITHUB_TOKEN starts no workflow, so the version commit gets its assets here.
      - name: Read the release commit
        id: commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  assets:
    name: Pre-build assets
    needs: release
    if: needs.release.outputs.commit
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.release.outputs.commit }}
    permissions:
      contents: write
